<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background obsidian gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F17"/>
      <stop offset="100%" stop-color="#121C28"/>
    </linearGradient>

    <!-- Glowing perimeter stroke gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#385E00" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Radial ambient glow behind emblem -->
    <radialGradient id="glowGrad" cx="50%" cy="47%" r="45%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>

    <!-- NVIDIA signature green gradient -->
    <linearGradient id="nvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EF01A"/>
      <stop offset="50%" stop-color="#76B900"/>
      <stop offset="100%" stop-color="#4E8000"/>
    </linearGradient>

    <!-- High-contrast installer accent gradient -->
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76B900"/>
      <stop offset="50%" stop-color="#A3F200"/>
      <stop offset="100%" stop-color="#76B900"/>
    </linearGradient>
  </defs>

  <!-- Modern Rounded Squircle Base (Matching Windows 11 Fluent Spec) -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Ambient Radial Glow -->
  <circle cx="256" cy="242" r="190" fill="url(#glowGrad)"/>

  <!-- Official NVIDIA Emblem Vector -->
  <g transform="translate(256, 238) scale(14.2) translate(-12, -12)">
    <path fill="url(#nvGrad)" d="M8.948 8.798v-1.43a6.7 6.7 0 0 1 .424-.018c3.922-.124 6.493 3.374 6.493 3.374s-2.774 3.851-5.75 3.851c-.398 0-.787-.062-1.158-.185v-4.346c1.528.185 1.837.857 2.747 2.385l2.04-1.714s-1.492-1.952-4-1.952a6.016 6.016 0 0 0-.796.035m0-4.735v2.138l.424-.027c5.45-.185 9.01 4.47 9.01 4.47s-4.08 4.964-8.33 4.964c-.37 0-.733-.035-1.095-.097v1.325c.3.035.61.062.91.062 3.957 0 6.82-2.023 9.593-4.408.459.371 2.34 1.263 2.73 1.652-2.633 2.208-8.772 3.984-12.253 3.984-.335 0-.653-.018-.971-.053v1.864H24V4.063zm0 10.326v1.131c-3.657-.654-4.673-4.46-4.673-4.46s1.758-1.944 4.673-2.262v1.237H8.94c-1.528-.186-2.73 1.245-2.73 1.245s.68 2.412 2.739 3.11M2.456 10.9s2.164-3.197 6.5-3.533V6.201C4.153 6.59 0 10.653 0 10.653s2.35 6.802 8.948 7.42v-1.237c-4.84-.6-6.492-5.936-6.492-5.936z"/>
  </g>

  <!-- Precision Driver Installation Chevron Accents -->
  <path d="M188 382 L256 418 L324 382" fill="none" stroke="#76B900" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M216 406 L256 428 L296 406" fill="none" stroke="url(#chevronGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
